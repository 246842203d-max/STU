<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学籍通 · 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>学籍通 · 学生信息管理</h1>
        <div class="user-meta">当前管理员：<strong id="adminName">-</strong></div>
      </div>
      <div class="topbar-actions">
        <button id="logoutBtn" class="btn btn-ghost" type="button">退出登录</button>
      </div>
    </header>

    <main class="main">
      <div id="pageMsg" class="msg" role="alert"></div>

      <div class="toolbar">
        <div class="search-bar">
          <input id="searchInput" placeholder="按学号 / 姓名 / 班级 / 专业查询" />
          <button id="searchBtn" class="btn btn-secondary" type="button">查询</button>
        </div>
        <button id="addBtn" class="btn btn-primary" type="button" style="width:auto">新增学生</button>
      </div>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>班级</th>
                <th>专业</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="studentBody"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" style="display:none">暂无学生信息，点击「新增学生」开始录入</div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">新增学生信息</h2>
      <form id="studentForm">
        <div class="form-row">
          <div class="form-group">
            <label for="student_no">学号</label>
            <input id="student_no" required />
          </div>
          <div class="form-group">
            <label for="name">姓名</label>
            <input id="name" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="gender">性别</label>
            <select id="gender">
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="form-group">
            <label for="age">年龄</label>
            <input id="age" type="number" min="1" max="120" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="class_name">班级</label>
            <input id="class_name" />
          </div>
          <div class="form-group">
            <label for="major">专业</label>
            <input id="major" />
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label for="password">登录密码</label>
            <input id="password" type="password" />
            <p id="passwordHint" class="hint" style="display:none">编辑时留空表示不修改原密码</p>
          </div>
        </div>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn btn-ghost" type="button">取消</button>
          <button class="btn btn-primary" type="submit" style="width:auto">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
