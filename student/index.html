<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学籍通 · 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1 class="brand">学籍通</h1>
      <p class="brand-sub">学生信息管理系统 · 安全登录后管理或查看学籍档案</p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-role="admin">管理员登录</button>
        <button type="button" class="tab" data-role="student">学生登录</button>
      </div>

      <div id="msg" class="msg" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label id="accountLabel" for="account">用户名</label>
          <input id="account" name="account" autocomplete="username" placeholder="请输入管理员用户名" value="admin" required />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
        </div>
        <button class="btn btn-primary" type="submit">登录</button>
      </form>

      <p class="auth-links">
        学生没有账号？ <a href="/register.html">去注册</a>
      </p>
      <p class="hint">默认管理员：admin / admin（首次访问会自动初始化数据库）</p>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
